spring.application.name=projektportal
server.port=8080

# --- Datenhaltungsschicht ---------------------------------------------------
# H2 im Dateimodus: die Daten liegen unter ./daten und bleiben damit ueber
# Neustarts hinweg erhalten (Anforderung "Daten persistent speichern").
# Der Wechsel auf PostgreSQL oder MySQL erfordert nur einen anderen Treiber und
# eine andere URL, weil der gesamte Zugriff ueber Spring Data JPA laeuft.
spring.datasource.url=jdbc:h2:file:./daten/projektportal;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate als JPA-Provider leitet das Schema aus den Entities ab.
spring.jpa.hibernate.ddl-auto=update
# Lazy Loading ausserhalb der Serviceschicht wird bewusst unterbunden: Alle
# Entities werden innerhalb der Transaktion in DTOs uebersetzt.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Schreibt das von Hibernate erzeugte Schema zusaetzlich zur Dokumentation in
# eine Datei. Sobald die JPA-Skriptgenerierung aktiv ist, muss die
# Datenbankaktion ebenfalls JPA-konform angegeben werden - andernfalls legt
# Hibernate die Tabellen nicht mehr an.
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=update
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/generiertes-schema.sql

# --- Fehlerbehandlung -------------------------------------------------------
# Technische Details gehoeren ins Serverlog, nicht in die HTTP-Antwort.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Sitzung ----------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# --- Anwendungsspezifisch ---------------------------------------------------
# Legt beim ersten Start einen nachvollziehbaren Demodatenbestand an.
projektportal.demodaten=true
projektportal.demo-kennwort=Fallstudie2026!
