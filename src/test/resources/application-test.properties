# Testprofil: Die Tests laufen gegen eine reine In-Memory-Datenbank, die je
# Testlauf neu aufgebaut wird. Dadurch sind sie voneinander und vom
# Entwicklungsdatenbestand unabhaengig und koennen in beliebiger Reihenfolge
# ausgefuehrt werden.
spring.datasource.url=jdbc:h2:mem:projektportal-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=drop-and-create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=none

# Keine Demodaten: Jeder Test legt genau den Datenbestand an, den er braucht.
projektportal.demodaten=false
projektportal.demo-kennwort=nicht-verwendet

logging.level.org.hibernate.SQL=warn
