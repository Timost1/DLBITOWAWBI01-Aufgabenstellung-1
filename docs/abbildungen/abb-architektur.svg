<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33415c"/>
    </marker>
  </defs>
  <style>
    .schicht { font-size:17px; font-weight:700; }
    .unter { font-size:13px; }
    .pt { font-size:15px; font-weight:700; fill:#12203c; }
    .px { font-size:13px; fill:#42604a; }
    .cx { font-size:13px; fill:#4a5a7a; }
    .kante { font-size:13.5px; font-weight:600; fill:#33415c; }
    .hin { font-size:12.5px; font-style:italic; fill:#5a6b8c; }
  </style>

  <rect width="800" height="660" fill="#ffffff"/>

  <!-- ===== Client ===== -->
  <rect x="20" y="16" width="760" height="108" rx="9" fill="#eef3fb" stroke="#0b3d91" stroke-width="2"/>
  <text class="schicht" x="38" y="42" fill="#0b3d91">Client (Browser)</text>
  <text class="unter" x="38" y="62" fill="#33415c">Präsentationsschicht</text>

  <rect x="38" y="74" width="724" height="36" rx="6" fill="#ffffff" stroke="#8aa4cf"/>
  <text class="cx" x="52" y="97"><tspan font-weight="600" font-size="14px" fill="#12203c">Benutzeroberfläche</tspan>  –  React und Material UI; der Zustand der Oberfläche liegt im Browser</text>

  <!-- ===== Kopplung ===== -->
  <line x1="330" y1="124" x2="330" y2="172" stroke="#33415c" stroke-width="1.7" marker-end="url(#pf)"/>
  <line x1="470" y1="172" x2="470" y2="124" stroke="#33415c" stroke-width="1.7" marker-end="url(#pf)"/>
  <rect x="330" y="134" width="140" height="26" fill="#ffffff"/>
  <text class="kante" x="400" y="152" text-anchor="middle">REST über JSON</text>

  <!-- ===== Server ===== -->
  <rect x="20" y="172" width="760" height="352" rx="9" fill="#f3f6f2" stroke="#2f6b3a" stroke-width="2"/>
  <text class="schicht" x="38" y="198" fill="#2f6b3a">Server (Spring Boot)</text>
  <text class="unter" x="38" y="218" fill="#33415c">Anwendungsschicht</text>

  <!-- Paket web -->
  <rect x="44" y="232" width="376" height="56" rx="6" fill="#ffffff" stroke="#7fa886"/>
  <text class="pt" x="58" y="254">Paket web</text>
  <text class="px" x="58" y="275">Nimmt die HTTP-Anfragen entgegen</text>

  <!-- Paket service -->
  <rect x="44" y="316" width="376" height="56" rx="6" fill="#ffffff" stroke="#7fa886"/>
  <text class="pt" x="58" y="338">Paket service</text>
  <text class="px" x="58" y="359">Enthält die Fachlogik und die Berechtigungsprüfung</text>

  <!-- Paket repository -->
  <rect x="44" y="400" width="376" height="56" rx="6" fill="#ffffff" stroke="#7fa886"/>
  <text class="pt" x="58" y="422">Paket repository</text>
  <text class="px" x="58" y="443">Greift auf die Datenbank zu</text>

  <!-- Paket domain -->
  <rect x="462" y="232" width="294" height="224" rx="6" fill="#ffffff" stroke="#7fa886"/>
  <text class="pt" x="476" y="254">Paket domain</text>
  <text class="px" x="476" y="275">Enthält die Entitäten</text>
  <text class="px" x="476" y="300">Mandant</text>
  <text class="px" x="476" y="322">Benutzer</text>
  <text class="px" x="476" y="344">Projekt</text>
  <text class="px" x="476" y="366">Aufgabe</text>
  <line x1="476" y1="384" x2="742" y2="384" stroke="#c3d6c7"/>
  <text class="hin" x="476" y="404">Alle drei Pakete arbeiten</text>
  <text class="hin" x="476" y="422">auf den Entitäten.</text>

  <!-- Abhaengigkeitspfeile -->
  <line x1="232" y1="288" x2="232" y2="316" stroke="#33415c" stroke-width="1.7" marker-end="url(#pf)"/>
  <line x1="232" y1="372" x2="232" y2="400" stroke="#33415c" stroke-width="1.7" marker-end="url(#pf)"/>
  <line x1="420" y1="260" x2="462" y2="260" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pf)"/>
  <line x1="420" y1="344" x2="462" y2="344" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pf)"/>
  <line x1="420" y1="428" x2="462" y2="428" stroke="#33415c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pf)"/>

  <text class="hin" x="44" y="486">Die Abhängigkeiten verlaufen nur in eine Richtung.</text>

  <!-- Pakete der technischen Konfiguration -->
  <rect x="462" y="468" width="294" height="44" rx="6" fill="#fbfcfa" stroke="#9cbba2" stroke-dasharray="5 4"/>
  <text class="pt" x="476" y="489">Pakete config und security</text>
  <text class="px" x="476" y="506">Enthalten die technische Konfiguration</text>

  <!-- ===== Datenhaltung ===== -->
  <line x1="400" y1="524" x2="400" y2="566" stroke="#33415c" stroke-width="1.7" marker-end="url(#pf)"/>
  <text class="kante" x="414" y="550">Zugriff über Hibernate</text>

  <rect x="20" y="566" width="760" height="76" rx="9" fill="#fdf4ec" stroke="#a15c1e" stroke-width="2"/>
  <text class="schicht" x="38" y="594" fill="#a15c1e">Datenbank</text>
  <text class="unter" x="38" y="614" fill="#33415c">Datenhaltungsschicht</text>
  <text class="px" x="38" y="632" fill="#6b4520">Relationale Datenbank; die Daten werden in Tabellen gespeichert</text>
</svg>
