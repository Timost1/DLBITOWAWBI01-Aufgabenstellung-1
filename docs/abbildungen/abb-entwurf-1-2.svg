<svg xmlns="http://www.w3.org/2000/svg" width="560" height="840" viewBox="0 0 560 840" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="840" fill="#ffffff"/>
<style>
    .rahmen { fill:#ffffff; stroke:#8f9bb3; stroke-width:1.6; }
    .titel { font-size:13.5px; font-weight:700; fill:#1a2540; }
    .leiste { fill:#c7d2e4; stroke:#8f9bb3; stroke-width:1; }
    .feld { fill:#f2f4f8; stroke:#a9b4c8; stroke-width:1; }
    .knopf { fill:#8fa6cc; stroke:#5a6f96; stroke-width:1; }
    .knopf2 { fill:#ffffff; stroke:#5a6f96; stroke-width:1; }
    .platz { fill:#dfe4ec; }
    .txt { font-size:10.5px; fill:#33415c; }
    .txtw { font-size:10.5px; fill:#ffffff; font-weight:600; }
    .txtk { font-size:9.5px; fill:#5a6b8c; }
    .note { font-size:10px; fill:#7a6a2a; font-style:italic; }
  </style>
  <g transform="translate(-20,0)">
  <text x="40" y="30" class="titel">Entwurf 1 – Anmeldung (ohne Sitzung)</text>
  <rect x="40" y="42" width="520" height="360" class="rahmen"/>
  <rect x="185" y="92" width="230" height="260" class="feld"/>
  <text x="200" y="118" class="txtk">PROJEKTPORTAL</text>
  <text x="200" y="140" style="font-size:14px; font-weight:700; fill:#1a2540">Anmeldung</text>
  <text x="200" y="158" class="txtk">Projekt- und Aufgabenmanagement</text>
  <rect x="200" y="172" width="200" height="26" fill="#ffffff" stroke="#a9b4c8"/>
  <text x="208" y="189" class="txt">E-Mail-Adresse</text>
  <rect x="200" y="208" width="200" height="26" fill="#ffffff" stroke="#a9b4c8"/>
  <text x="208" y="225" class="txt">Kennwort</text>
  <rect x="200" y="248" width="200" height="28" class="knopf"/>
  <text x="300" y="266" class="txtw" text-anchor="middle">ANMELDEN</text>
  <line x1="200" y1="292" x2="400" y2="292" stroke="#c3cbda"/>
  <text x="200" y="310" class="txtk">Zugänge des Demodatenbestands</text>
  <rect x="200" y="318" width="200" height="8" class="platz"/>
  <rect x="200" y="330" width="200" height="8" class="platz"/>
  <rect x="200" y="342" width="140" height="8" class="platz"/>
  <text x="52" y="376" class="note">Fehlerhinweis erscheint oberhalb der Felder; keine Navigation sichtbar,</text>
  <text x="52" y="392" class="note">solange keine Sitzung besteht.</text>

  </g>
  <g transform="translate(-600,424)">
  <text x="620" y="30" class="titel">Entwurf 2 – Projektübersicht (#/projekte)</text>
  <rect x="620" y="42" width="520" height="360" class="rahmen"/>
  <rect x="620" y="42" width="520" height="30" class="leiste"/>
  <text x="632" y="62" style="font-size:11px; font-weight:700; fill:#1a2540">Projektportal</text>
  <text x="722" y="62" class="txt">Projekte</text>
  <text x="772" y="62" class="txt">Benutzerverwaltung</text>
  <rect x="1060" y="50" width="68" height="16" class="knopf2"/>
  <text x="1094" y="62" class="txtk" text-anchor="middle">Abmelden</text>

  <text x="636" y="96" style="font-size:13px; font-weight:700; fill:#1a2540">Projekte</text>
  <text x="636" y="112" class="txtk">Projekte des Mandanten, für die Sie berechtigt sind</text>
  <rect x="1020" y="86" width="108" height="24" class="knopf"/>
  <text x="1074" y="102" class="txtw" text-anchor="middle">NEUES PROJEKT</text>

  <rect x="636" y="124" width="66" height="20" class="feld"/>
  <text x="669" y="138" class="txtk" text-anchor="middle">Aktiv</text>
  <rect x="702" y="124" width="80" height="20" fill="#ffffff" stroke="#a9b4c8"/>
  <text x="742" y="138" class="txtk" text-anchor="middle">Archiviert</text>
  <rect x="782" y="124" width="60" height="20" fill="#ffffff" stroke="#a9b4c8"/>
  <text x="812" y="138" class="txtk" text-anchor="middle">Alle</text>

  <!-- Kacheln -->
  <g>
    <rect x="636" y="158" width="238" height="150" fill="#ffffff" stroke="#a9b4c8"/>
    <text x="650" y="180" style="font-size:11.5px; font-weight:700; fill:#1a2540">Projektname</text>
    <rect x="820" y="168" width="40" height="16" rx="8" class="knopf"/>
    <text x="840" y="180" style="font-size:8.5px; fill:#ffffff; font-weight:600" text-anchor="middle">Aktiv</text>
    <text x="650" y="198" class="txtk">Kunde</text>
    <text x="650" y="216" class="txtk">Leitung · Teamgröße</text>
    <text x="650" y="240" class="txtk">Fortschritt</text>
    <text x="860" y="240" class="txtk" text-anchor="end">43 %</text>
    <rect x="650" y="246" width="210" height="8" rx="4" class="platz"/>
    <rect x="650" y="246" width="90" height="8" rx="4" fill="#5a6f96"/>
    <text x="650" y="270" class="txtk">3 von 7 erledigt · 2 in Bearbeitung · 2 offen</text>
    <text x="650" y="286" class="txtk">Zeitraum</text>
    <rect x="650" y="292" width="90" height="20" class="knopf2"/>
    <text x="695" y="306" class="txtk" text-anchor="middle">Projekt öffnen</text>
  </g>
  <g>
    <rect x="890" y="158" width="238" height="150" fill="#ffffff" stroke="#a9b4c8"/>
    <rect x="904" y="172" width="120" height="10" class="platz"/>
    <rect x="904" y="190" width="80" height="8" class="platz"/>
    <rect x="904" y="208" width="150" height="8" class="platz"/>
    <rect x="904" y="246" width="210" height="8" rx="4" class="platz"/>
    <rect x="904" y="246" width="55" height="8" rx="4" fill="#5a6f96"/>
    <rect x="904" y="268" width="180" height="8" class="platz"/>
    <rect x="904" y="292" width="90" height="20" class="knopf2"/>
  </g>
  <text x="632" y="336" class="note">Kachelraster: drei Spalten ab großen Bildschirmen, zwei auf Tablets, eine auf Mobilgeräten.</text>
  <text x="632" y="352" class="note">Der Fortschritt ist auf jeder Kachel sichtbar, damit kein Seitenwechsel nötig ist.</text>
  <text x="632" y="368" class="note">„Neues Projekt“ nur für Projektleitung und Administration.</text>

  </g>
</svg>
