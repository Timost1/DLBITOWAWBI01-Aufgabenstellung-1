  <text x="632" y="800" class="note">Die Rollen werden im Dialog als Mehrfachauswahl vergeben; ein Schalter steuert den Aktivstatus.</text>
  <text x="632" y="816" class="note">Das eigene Konto ist gekennzeichnet und kann sich weder die Administratorrolle entziehen</text>
