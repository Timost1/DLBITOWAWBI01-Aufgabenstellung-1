<svg xmlns="http://www.w3.org/2000/svg" width="900" height="745" viewBox="0 0 900 745" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="assoz" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#22314f" stroke-width="1.5"/>
    </marker>
    <marker id="assozg" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#8a6d1f" stroke-width="1.5"/>
    </marker>
    <marker id="komp" viewBox="0 0 16 16" refX="2" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 8 L 8 4 L 15 8 L 8 12 z" fill="#22314f"/>
    </marker>
  </defs>
  <style>
    .kl { fill:#ffffff; stroke:#22314f; stroke-width:1.7; }
    .klk { fill:#dde6f4; stroke:#22314f; stroke-width:1.7; }
    .kn { font-size:17px; font-weight:700; fill:#12203c; text-anchor:middle; }
    .at { font-size:13.5px; fill:#22314f; font-family:Consolas, monospace; }
    .en { fill:#fbf6ea; stroke:#8a6d1f; stroke-width:1.7; }
    .enk { fill:#f2e6c8; stroke:#8a6d1f; stroke-width:1.7; }
    .ens { font-size:12.5px; fill:#6b5416; text-anchor:middle; }
    .enn { font-size:16px; font-weight:700; fill:#5a4612; text-anchor:middle; }
    .env { font-size:13.5px; fill:#5a4612; font-family:Consolas, monospace; }
    .mu { font-size:13px; fill:#22314f; }
    .rl { font-size:13px; fill:#3d4f75; }
  </style>

  <rect width="900" height="745" fill="#ffffff"/>

  <!-- Aufzaehlungstyp Rolle -->
  <rect class="en" x="20" y="16" width="205" height="104"/>
  <rect class="enk" x="20" y="16" width="205" height="42"/>
  <text class="ens" x="122" y="33">&#171;enumeration&#187;</text>
  <text class="enn" x="122" y="52">Rolle</text>
  <text class="env" x="32" y="78">ADMIN</text>
  <text class="env" x="32" y="96">PROJEKTLEITER</text>
  <text class="env" x="32" y="114">MITARBEITER</text>

  <!-- Mandant -->
  <rect class="kl" x="370" y="16" width="250" height="112"/>
  <rect class="klk" x="370" y="16" width="250" height="30"/>
  <text class="kn" x="495" y="37">Mandant</text>
  <text class="at" x="382" y="65">- id: Long</text>
  <text class="at" x="382" y="83">- kuerzel: String</text>
  <text class="at" x="382" y="101">- name: String</text>
  <text class="at" x="382" y="119">- aktiv: boolean</text>

  <!-- Benutzer -->
  <rect class="kl" x="20" y="236" width="255" height="212"/>
  <rect class="klk" x="20" y="236" width="255" height="30"/>
  <text class="kn" x="147" y="257">Benutzer</text>
  <text class="at" x="32" y="285">- id: Long</text>
  <text class="at" x="32" y="303">- email: String</text>
  <text class="at" x="32" y="321">- passwortHash: String</text>
  <text class="at" x="32" y="339">- vorname: String</text>
  <text class="at" x="32" y="357">- nachname: String</text>
  <text class="at" x="32" y="375">- aktiv: boolean</text>
  <text class="at" x="32" y="393">- rollen: Set&lt;Rolle&gt;</text>
  <line x1="20" y1="402" x2="275" y2="402" stroke="#22314f"/>
  <text class="at" x="32" y="420">+ getVollerName()</text>
  <text class="at" x="32" y="438">+ hatRolle(Rolle)</text>

  <!-- Projekt -->
  <rect class="kl" x="370" y="236" width="255" height="248"/>
  <rect class="klk" x="370" y="236" width="255" height="30"/>
  <text class="kn" x="497" y="257">Projekt</text>
  <text class="at" x="382" y="285">- id: Long</text>
  <text class="at" x="382" y="303">- name: String</text>
  <text class="at" x="382" y="321">- kunde: String</text>
  <text class="at" x="382" y="339">- beschreibung: String</text>
  <text class="at" x="382" y="357">- status: Projektstatus</text>
  <text class="at" x="382" y="375">- startDatum: LocalDate</text>
  <text class="at" x="382" y="393">- endDatum: LocalDate</text>
  <line x1="370" y1="402" x2="625" y2="402" stroke="#22314f"/>
  <text class="at" x="382" y="420">+ istBeteiligt(Benutzer)</text>
  <text class="at" x="382" y="438">+ istArchiviert()</text>
  <text class="at" x="382" y="456">+ archivieren()</text>
  <text class="at" x="382" y="474">+ reaktivieren()</text>

  <!-- Aufzaehlungstyp Projektstatus -->
  <rect class="en" x="685" y="236" width="195" height="94"/>
  <rect class="enk" x="685" y="236" width="195" height="42"/>
  <text class="ens" x="782" y="253">&#171;enumeration&#187;</text>
  <text class="enn" x="782" y="272">Projektstatus</text>
  <text class="env" x="697" y="298">AKTIV</text>
  <text class="env" x="697" y="318">ARCHIVIERT</text>

  <!-- Aufgabe -->
  <rect class="kl" x="370" y="570" width="255" height="148"/>
  <rect class="klk" x="370" y="570" width="255" height="30"/>
  <text class="kn" x="497" y="591">Aufgabe</text>
  <text class="at" x="382" y="619">- id: Long</text>
  <text class="at" x="382" y="637">- titel: String</text>
  <text class="at" x="382" y="655">- beschreibung: String</text>
  <text class="at" x="382" y="673">- status: Aufgabenstatus</text>
  <text class="at" x="382" y="691">- faelligAm: LocalDate</text>
  <text class="at" x="382" y="709">- erstelltAm: Instant</text>

  <!-- Aufzaehlungstyp Aufgabenstatus -->
  <rect class="en" x="685" y="570" width="195" height="112"/>
  <rect class="enk" x="685" y="570" width="195" height="42"/>
  <text class="ens" x="782" y="587">&#171;enumeration&#187;</text>
  <text class="enn" x="782" y="606">Aufgabenstatus</text>
  <text class="env" x="697" y="632">OFFEN</text>
  <text class="env" x="697" y="652">IN_BEARBEITUNG</text>
  <text class="env" x="697" y="672">ERLEDIGT</text>

  <!-- Benutzer verwendet Rolle -->
  <line x1="110" y1="236" x2="110" y2="120" stroke="#8a6d1f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#assozg)"/>
  <text class="mu" x="118" y="142" fill="#6b5416">1..*</text>
  <text class="rl" x="118" y="196" fill="#6b5416">rollen</text>

  <!-- Mandant zu Benutzer -->
  <path d="M 400 128 L 400 176 L 215 176 L 215 236" fill="none" stroke="#22314f" stroke-width="1.6" marker-end="url(#assoz)"/>
  <text class="mu" x="406" y="150">1</text>
  <text class="mu" x="222" y="230">0..*</text>
  <text class="rl" x="252" y="170">gehört zu</text>

  <!-- Mandant zu Projekt -->
  <line x1="540" y1="128" x2="540" y2="236" stroke="#22314f" stroke-width="1.6" marker-end="url(#assoz)"/>
  <text class="mu" x="532" y="152" text-anchor="end">1</text>
  <text class="mu" x="532" y="230" text-anchor="end">0..*</text>
  <text class="rl" x="548" y="188">gehört zu</text>

  <!-- Projektleitung -->
  <line x1="370" y1="288" x2="275" y2="288" stroke="#22314f" stroke-width="1.6" marker-end="url(#assoz)"/>
  <text class="mu" x="364" y="281" text-anchor="end">0..*</text>
  <text class="mu" x="283" y="281">1</text>
  <text class="rl" x="322" y="308" text-anchor="middle">leitet</text>

  <!-- Zuordnung der Mitarbeitenden -->
  <path d="M 370 356 L 322 356 L 322 402 L 275 402" fill="none" stroke="#22314f" stroke-width="1.6" marker-end="url(#assoz)"/>
  <text class="mu" x="364" y="349" text-anchor="end">0..*</text>
  <text class="mu" x="283" y="396">0..*</text>
  <rect x="280" y="368" width="86" height="16" fill="#ffffff"/>
  <text style="font-size:12px; fill:#3d4f75" x="323" y="380" text-anchor="middle">Mitarbeitende</text>

  <!-- Projekt enthaelt Aufgaben -->
  <line x1="570" y1="484" x2="570" y2="570" stroke="#22314f" stroke-width="1.6" marker-start="url(#komp)" marker-end="url(#assoz)"/>
  <text class="mu" x="562" y="510" text-anchor="end">1</text>
  <text class="mu" x="562" y="564" text-anchor="end">0..*</text>
  <text class="rl" x="580" y="534">enthält</text>

  <!-- Bearbeitung einer Aufgabe -->
  <path d="M 370 620 L 340 620 L 340 430 L 275 430" fill="none" stroke="#22314f" stroke-width="1.6" marker-end="url(#assoz)"/>
  <text class="mu" x="364" y="613" text-anchor="end">0..*</text>
  <text class="mu" x="283" y="424">0..1</text>
  <text class="rl" x="350" y="534">bearbeitet von</text>

  <!-- Verwendung der Aufzaehlungstypen -->
  <line x1="625" y1="310" x2="685" y2="292" stroke="#8a6d1f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#assozg)"/>
  <line x1="625" y1="640" x2="685" y2="636" stroke="#8a6d1f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#assozg)"/>

  <!-- Legende -->
  <rect x="20" y="490" width="310" height="112" rx="6" fill="#f7f9fc" stroke="#b9c4d8"/>
  <text x="32" y="512" style="font-size:13.5px; font-weight:700; fill:#12203c">Legende</text>
  <line x1="32" y1="532" x2="72" y2="532" stroke="#22314f" stroke-width="1.6" marker-end="url(#assoz)"/>
  <text class="rl" x="82" y="536">Assoziation mit Multiplizität</text>
  <line x1="32" y1="558" x2="72" y2="558" stroke="#22314f" stroke-width="1.6" marker-start="url(#komp)"/>
  <text class="rl" x="82" y="562">Komposition</text>
  <line x1="32" y1="584" x2="72" y2="584" stroke="#8a6d1f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#assozg)"/>
  <text class="rl" x="82" y="588">Verwendung eines Aufzählungstyps</text>
</svg>
